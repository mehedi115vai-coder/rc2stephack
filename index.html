        function updateDotsByAccuracy(percent) {
            const container = document.getElementById('confidenceDots');
            if (!container) return;
            const dots = container.querySelectorAll('.dot-conf');
            let val = parseFloat(percent);
            let activeCount = Math.min(5, Math.max(0, Math.floor((val - 50) / 10))); 
            dots.forEach((dot, idx) => {
                if (idx < activeCount) dot.classList.add('active');
                else dot.classList.remove('active');
            });

        // --- PREDICTION ENGINE ---
        function computeNewFormulaPrediction(lastFiveNumbers, currentModeState) {
            if (!lastFiveNumbers || lastFiveNumbers.length < 5) return { prediction: 'SMALL', finalDiff: 4 };
            
            let weightSum = 0;
            let totalWeights = 15;
            for (let i = 0; i < 5; i++) {
                let weight = 5 - i; 
                weightSum += lastFiveNumbers[i] * weight;
            }
            let weightedAverage = weightSum / totalWeights;
            
            let diff1 = Math.abs(lastFiveNumbers[0] - lastFiveNumbers[1]);
            let diff2 = Math.abs(lastFiveNumbers[1] - lastFiveNumbers[2]);
            let trendFactor = (diff1 + diff2) / 2;
            
            let coreValue = Math.floor(weightedAverage + trendFactor) % 10;
            let prediction = (coreValue >= 5) ? 'BIG' : 'SMALL';
            
            let lastThreeOutcomes = lastFiveNumbers.slice(0, 3).map(n => n >= 5 ? 'BIG' : 'SMALL');
            if (lastThreeOutcomes[0] === lastThreeOutcomes[1] && lastThreeOutcomes[1] === lastThreeOutcomes[2]) {
                prediction = (lastThreeOutcomes[0] === 'BIG') ? 'SMALL' : 'BIG';
            }
            
            if (currentModeState.lossCounter >= 3) {
                prediction = (prediction === 'BIG') ? 'SMALL' : 'BIG';
                coreValue = (prediction === 'SMALL') ? 2 : 7;
                currentModeState.lossCounter = 0; 
            }
            return { prediction, finalDiff: coreValue };
        }

        function checkActualMatchPattern(lastGenerated, actualOutcome) {
            if(!lastGenerated) return true;
            return lastGenerated === actualOutcome;
        }

        // --- UI FUNCTIONS ---
        function switchTimeMode(seconds) {
            if(selectedTimeMode === seconds) return;
            selectedTimeMode = seconds;
            
            if(seconds === 30) {
                document.getElementById('btn30s').classList.add('active');
                document.getElementById('btn1m').classList.remove('active');
            } else {
                document.getElementById('btn1m').classList.add('active');
                document.getElementById('btn30s').classList.remove('active');
            }
            renderHistoryBox();
            fetchData();
        }

        function renderHistoryBox() {
            const histBox = document.getElementById('historyBox');
            if(!histBox) return;
            histBox.innerHTML = "";
            const data = cachedSignals[selectedTimeMode].history;
            for(let i = data.length - 1; i >= 0; i--) {
                const item = data[i];
                const row = document.createElement('div');
                row.className = 'hist-item';
                row.innerHTML = `<span>${item.serial}</span> <span style="color:${item.themeColor}; font-weight:bold;">${item.pred.charAt(0)}(${item.n1},${item.n2})</span>`;
                histBox.appendChild(row);
            }
        }
        
        async function fetchData() {
            if (!cardActive || currentMode !== "expanded") return;
            
            const CURRENT_API = selectedTimeMode === 30 ? API_30S : API_1M;
            const modeState = cachedSignals[selectedTimeMode];
            
            try {
                const res = await fetch(CURRENT_API + '?t=' + Date.now());
                const data = await res.json();
                if (data && data.data && data.data.list) {
                    const list = data.data.list;
                    if(list.length < 5) return;

                    const lastFiveNumbers = list.slice(0, 5).map(item => parseInt(item.number));
                    const latestPeriod = list[0].issueNumber;
                    
                    const nextPeriodId = (BigInt(latestPeriod) + 1n).toString();
                    const currentSerial = nextPeriodId.slice(-4); 
                    
                    const periodEl = document.getElementById('p_id');
                    if(periodEl) {
                        periodEl.innerText = nextPeriodId;
                    }

                    const resultData = computeNewFormulaPrediction(lastFiveNumbers, modeState);
                    const prediction = resultData.prediction;
                    const dynamicSeed = resultData.finalDiff;

                    if(nextPeriodId !== modeState.lastPeriodId) {
                        const lastOutcomeNum = parseInt(list[0].number);
                        const lastActualOutcome = (lastOutcomeNum <= 4) ? 'SMALL' : 'BIG';
                        
                        if(modeState.history.length > 0) {
                            const lastPredictedObj = modeState.history[modeState.history.length - 1];
                            const isWin = checkActualMatchPattern(lastPredictedObj.pred, lastActualOutcome);
                            if(!isWin) { modeState.lossCounter++; } else { modeState.lossCounter = 0; }
                            triggerPremiumPopup(selectedTimeMode, isWin);
                        }

                        modeState.lastPeriodId = nextPeriodId;

                        let confidence = (dynamicSeed === 0 || dynamicSeed === 9 || dynamicSeed === 1 || dynamicSeed === 8) ? 94 : 88;
                        const accSpan = document.getElementById('accValue');
                        if(accSpan) accSpan.innerText = confidence + "%";
                        updateDotsByAccuracy(confidence);

                        let n1, n2;
                        if (prediction === "BIG") {
                            n1 = [5,6,7,8,9][Math.floor(Math.random()*5)];
                            n2 = [5,6,7,8,9][Math.floor(Math.random()*5)];
                        } else {
                            n1 = [0,1,2,3,4][Math.floor(Math.random()*5)];
                            n2 = [0,1,2,3,4][Math.floor(Math.random()*5)];
                        }

                        let col = [1,3,7,9].includes(n1) ? "GREEN" : ([2,4,6,8].includes(n1) ? "RED" : "VIOLET");
                        let themeColor = (col === "GREEN") ? "#00ffaa" : (col === "RED" ? "#ff4d6d" : "#ca6eff");

                        const numDiv1 = document.getElementById('numCircle1');
                        if(numDiv1) {
                            numDiv1.innerText = n1;
                            numDiv1.style.borderColor = themeColor;
                            numDiv1.style.boxShadow = `0 0 10px ${themeColor}`;
                            numDiv1.style.color = themeColor;
                        }
                        const numDiv2 = document.getElementById('numCircle2');
                        if(numDiv2) {
                            numDiv2.innerText = n2;
                            numDiv2.style.borderColor = themeColor;
                            numDiv2.style.boxShadow = `0 0 10px ${themeColor}`;
                            numDiv2.style.color = themeColor;
                        }
                        const predSpan = document.getElementById('predText');
                        if(predSpan) {
                            predSpan.innerText = prediction;
                            predSpan.style.color = themeColor;
                        }
                        const chipSpan = document.getElementById('colorChip');
                        if(chipSpan){
                            chipSpan.innerText = col;
                            chipSpan.style.backgroundColor = themeColor;
                            chipSpan.style.color = (col === "GREEN" || col === "RED") ? "#000" : "#fff";
                        }
                        const trendSpan = document.getElementById('trendSpan');
                        if(trendSpan) trendSpan.innerText = prediction;
                        const suggSpan = document.getElementById('suggestSpan');
                        if(suggSpan) suggSpan.innerText = prediction;

                        const historyArray = modeState.history;
                        historyArray.push({ serial: currentSerial, pred: prediction, n1, n2, themeColor });
                        if(historyArray.length > 5) historyArray.shift();
                        renderHistoryBox();
                    }
                }
            } catch (e) {
                // silently fail
            }
        }

        function updateCountdownTimer() {
            const now = new Date();
            const sec = now.getSeconds();
            const remain = selectedTimeMode - (sec % selectedTimeMode);
            const timerEl = document.getElementById('timer_display');
            if(timerEl) {
                if(selectedTimeMode === 30) {
                    timerEl.innerText = `00:${remain<10?'0'+remain:remain}`;
                } else {
                    timerEl.innerText = `01:${remain<10?'0'+remain:remain}`;
                    if(remain < 60) {
                        timerEl.innerText = `00:${remain<10?'0'+remain:remain}`;
                    }
                }
            }
            if (remain === selectedTimeMode || remain === (selectedTimeMode - 1)) {
                fetchData();
            }
        }
        
        function startAISession() {
            fetchData();
            if(aiInterval) clearInterval(aiInterval);
            aiInterval = setInterval(() => {
                if(cardActive) { updateCountdownTimer(); }
            }, 1000);
            setInterval(fetchData, 4000);
        }
        
        // --- VIEW CONTROLS ---
        function showExpanded() {
            gateDiv.style.display = 'none';
            expandedDiv.style.display = 'block';
            collapsedDiv.style.display = 'none';
            cardRoot.style.width = '180px';
            cardRoot.style.background = 'rgba(10, 6, 26, 0.85)';
            cardRoot.style.border = '1px solid rgba(157, 80, 255, 0.6)';
            cardRoot.style.boxShadow = '0 15px 30px rgba(0,0,0,0.6), 0 0 15px rgba(157,80,255,0.25)';
            currentMode = "expanded";
            cardActive = true;
            startAISession();
        }
        
        function showCollapsed() {
            gateDiv.style.display = 'none';
            expandedDiv.style.display = 'none';
            collapsedDiv.style.display = 'block';
            cardRoot.style.width = 'auto';
            cardRoot.style.background = 'transparent';
            cardRoot.style.border = 'none';
            cardRoot.style.boxShadow = 'none';
            currentMode = "collapsed";
        }
        
        function removeCardPermanently() {
            if(aiInterval) { clearInterval(aiInterval); aiInterval = null; }
            cardActive = false;
            if(cardRoot) cardRoot.remove();
        }
        
        // --- UNLOCK HANDLER (No Firebase) ---
        function handleUnlock() {
            const pin = document.getElementById('accessPin');
            const inputKey = pin.value.trim();
            
            if(!inputKey) {
                alert("❌ Please enter a code!");
                return;
            }

            // Check against hardcoded password
            if (inputKey === VALID_ACCESS_CODE) {
                showExpanded();
            } else {
                alert("⛔ ACCESS DENIED • Invalid Key");
                pin.style.borderColor = "#ff4466";
                setTimeout(() => { if(pin) pin.style.borderColor = "rgba(157, 80, 255, 0.7)"; }, 700);
            }
        }
        
        // --- BIND EVENTS ---
        function bindEvents() {
            const unlockBtn = document.getElementById('unlockBtnMain');
            if(unlockBtn) unlockBtn.addEventListener('click', handleUnlock);
            
            const pinInput = document.getElementById('accessPin');
            if(pinInput) pinInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleUnlock(); });
            
            const foldBtn = document.getElementById('foldHideBtn');
            if(foldBtn) foldBtn.addEventListener('click', (e) => { e.stopPropagation(); showCollapsed(); });
            
            const exitPerm = document.getElementById('exitPermBtn');
            if(exitPerm) exitPerm.addEventListener('click', (e) => { e.stopPropagation(); removeCardPermanently(); });
            
            const expandCircle = document.getElementById('expandFromIconCircle');
            if(expandCircle) {
                expandCircle.addEventListener('click', (e) => { 
                    e.stopPropagation(); 
                    if(!isDraggingNow) showExpanded(); 
                });
            }
        }
        
        // --- DRAG SYSTEM ---
        let dragActive = false;
        let isDraggingNow = false; 
        let dragStartX = 0, dragStartY = 0, startLeft = 0, startTop = 0;
        
        function onDragStart(e) {
            const target = e.target;
            if (target.tagName === 'INPUT' || target.tagName === 'BUTTON' || target.tagName === 'A' || target.closest('button') || target.closest('input') || target.closest('a')) { return; }
            dragActive = true;
            isDraggingNow = false;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const leftVal = parseInt(cardRoot.style.left);
            const topVal = parseInt(cardRoot.style.top);
            startLeft = isNaN(leftVal) ? 16 : leftVal;
            startTop = isNaN(topVal) ? 20 : topVal;
            dragStartX = clientX - startLeft;
            dragStartY = clientY - startTop;
            cardRoot.style.transition = 'none';
        }
        
        function onDragMove(e) {
            if(!dragActive) return;
            isDraggingNow = true; 
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let newLeft = clientX - dragStartX;
            let newTop = clientY - dragStartY;
            const maxX = window.innerWidth - cardRoot.offsetWidth - 5;
            const maxY = window.innerHeight - cardRoot.offsetHeight - 5;
            newLeft = Math.min(Math.max(5, newLeft), maxX);
            newTop = Math.min(Math.max(5, newTop), maxY);
            cardRoot.style.left = newLeft + 'px';
            cardRoot.style.top = newTop + 'px';
        }
        
        function onDragEnd() {
            dragActive = false;
            cardRoot.style.transition = '';
            setTimeout(() => { isDraggingNow = false; }, 50);
        }
        
        // --- INIT ---
        cardRoot.addEventListener('touchstart', onDragStart, { passive: true });
        cardRoot.addEventListener('touchmove', onDragMove, { passive: true });
        cardRoot.addEventListener('touchend', onDragEnd);
        cardRoot.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);
        
        cardRoot.style.position = 'fixed';
        cardRoot.style.left = '16px';
        cardRoot.style.top = '20px';
        
        gateDiv.style.display = 'block';
        expandedDiv.style.display = 'none';
        collapsedDiv.style.display = 'none';
        cardActive = false;
        currentMode = "gate";
        
        bindEvents();
        
        // Expose switchTimeMode globally for inline onclick
        window.switchTimeMode = switchTimeMode;
    })();
</script>

                    w:c.offsetWidth,h:c.offsetHeight});
      }
