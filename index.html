// ==========================================
// SIGNAL ANALYSIS LOGIC
// ==========================================
function analyzeTrendPattern(historyList, nextIssueId) {
    if (!historyList || historyList.length === 0) {
        return { bs: "BIG", num: 7, trend: "📊 MOMENTUM TREND", color: "#00f5a0" };
    }

    const recentBS = historyList.slice(0, 10).map(item => {
        const num = parseInt(item.number || item.openNum || item.result, 10);
        return num >= 5 ? "BIG" : "SMALL";
    });

    let predictedBS = "BIG";
    let trendLabel = "📊 MOMENTUM TREND";
    let trendColor = "#00f5a0";

    if (recentBS.length >= 3 && recentBS[0] === recentBS[1] && recentBS[1] === recentBS[2]) {
        predictedBS = recentBS[0];
        trendLabel = `🔥 STREAK (${recentBS[0]})`;
        trendColor = "#f5b81b";
    }
    else if (recentBS.length >= 4 && recentBS[0] !== recentBS[1] && recentBS[1] !== recentBS[2] && recentBS[2] !== recentBS[3]) {
        predictedBS = (recentBS[0] === "BIG") ? "SMALL" : "BIG";
        trendLabel = "⚡ ZIGZAG TREND";
        trendColor = "#00b4d8";
    }
    else if (recentBS.length >= 4 && recentBS[0] === recentBS[1] && recentBS[2] === recentBS[3] && recentBS[0] !== recentBS[2]) {
        predictedBS = (recentBS[0] === "BIG") ? "SMALL" : "BIG";
        trendLabel = "🔄 PAIR SHIFT";
        trendColor = "#ff4d6d";
    }
    else {
        let bigScore = 0;
        let smallScore = 0;
        const weights = [6, 5, 4, 3, 2, 1];
        for (let i = 0; i < weights.length && i < recentBS.length; i++) {
            if (recentBS[i] === "BIG") bigScore += weights[i];
            else smallScore += weights[i];
        }
        predictedBS = (bigScore >= smallScore) ? "BIG" : "SMALL";
        trendLabel = "📈 WEIGHTED TREND";
        trendColor = "#00f5a0";
    }

    let seed = 0;
    for (let i = 0; i < nextIssueId.length; i++) {
        seed = ((seed << 5) - seed) + nextIssueId.charCodeAt(i);
        seed |= 0;
    }
    const numEntropy = Math.abs(Math.sin(seed * 9999));
    const eligibleNums = (predictedBS === "BIG") ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
    const luckyNum = eligibleNums[Math.floor(numEntropy * eligibleNums.length)];

    return {
        bs: predictedBS,
        num: luckyNum,
        trend: trendLabel,
        color: trendColor
    };
}

function masterPredict(nextIssueId) {
    const analysis = analyzeTrendPattern(rawApiHistoryList, nextIssueId);
    return {
        side: analysis.bs,
        number: analysis.num,
        period: nextIssueId
    };
}

function getTimerSec() {
    const now = new Date();
    const seconds = now.getSeconds();
    let remaining = (currentMode === '1M') ? (60 - seconds) : (30 - (seconds % 30));
    if (remaining === 60) remaining = 0;
    return remaining;
}

function getApiUrl() {
    return currentMode === "30S" 
        ? "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageNo=1&pageSize=50"

async function fetchActualResult(oldPeriod, predictedSide) {
    const targetUrl = getApiUrl(); const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);
    try {
        let res = await fetch(targetUrl).catch(()=>null); let data = res ? await res.json() : await (await fetch(proxyUrl)).json();
        let listData = data?.data?.list || data?.data || data; if (!listData || !Array.isArray(listData)) return false;
        
        rawApiHistoryList = listData;
        let ourIssueLast5 = String(oldPeriod).slice(-5);
        for(let item of listData) {
            let apiIssue = String(item.issueNumber || item.issue || item.period);
            if (apiIssue && apiIssue.slice(-5) === ourIssueLast5) {
                let num = parseInt(item.number || item.openNum || item.result, 10); if (isNaN(num)) return false;
                let actualResultSide = num >= 5 ? "BIG" : "SMALL";
                const isWin = predictedSide === actualResultSide;
                savedHistory.unshift({ period: ourIssueLast5, predicted: predictedSide, actual: actualResultSide, status: isWin ? "WIN" : "LOSS" });
                if (savedHistory.length > 20) savedHistory.pop();
                stats.total++; if(isWin) stats.win++; else stats.loss++;
                updateChartUI();
                
                if (isWin) {
                    triggerRoseRain();
                    try {
                        const wa = document.getElementById("winAudio");
                        if(wa) {
                            wa.currentTime = 0;
                            wa.play().catch(e => console.log("Song play blocked:", e));
                        }
                    } catch(err){}
                }
                
                return true;
            }
        }
        return false; 
    } catch (e) { return false; }
}

async function fetchInitialHistory() {
    const targetUrl = getApiUrl(); const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);
    try {
        let res = await fetch(targetUrl).catch(()=>null); let data = res ? await res.json() : await (await fetch(proxyUrl)).json();
        let listData = data?.data?.list || data?.data || data;
        if (Array.isArray(listData) && listData.length > 0) {
            rawApiHistoryList = listData;
            savedHistory = [];
            for(let i=0; i<Math.min(listData.length, 15); i++) {
                let item = listData[i]; let apiIssue = String(item.issueNumber || item.issue || item.period); let num = parseInt(item.number || item.openNum || item.result, 10);
                if(!isNaN(num) && apiIssue) savedHistory.push({ period: apiIssue.slice(-5), predicted: "---", actual: num >= 5 ? "BIG" : "SMALL", status: "MARKET" });
            }
            updateChartUI();
            
            const latestIssue = listData[0].issueNumber || listData[0].issue;
            const nextIssueId = (BigInt(latestIssue) + 1n).toString();
            curPeriod = nextIssueId;
            const pred = masterPredict(nextIssueId);
            currentPredSide = pred.side;
            renderResult(pred);
        }
    } catch(e) {}
}

function updateChartUI() {
    document.getElementById("stTotal").innerText = stats.total; document.getElementById("stWin").innerText = stats.win; document.getElementById("stLoss").innerText = stats.loss;
    const tbody = document.getElementById("histBody"); tbody.innerHTML = "";

        if(item.status === "MARKET") tr.style.opacity = "0.5";
        tr.innerHTML = `<td>${item.period}</td><td>${item.predicted}</td><td>${item.actual}</td><td class="${cls}">${item.status}</td>`;

}

    document.getElementById("periodCapsule").innerText = "ID: " + e.period.slice(-5);

}

async function tick(){
    const nt = getTimerSec();
    document.getElementById("timerEl").innerText = "00:" + String(nt).padStart(2, "0");

    if (nt % 3 === 0 || nt === 0) {
        const targetUrl = getApiUrl(); const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);
        try {
            let res = await fetch(targetUrl).catch(()=>null); let data = res ? await res.json() : await (await fetch(proxyUrl)).json();
            let listData = data?.data?.list || data?.data || data;
            if (Array.isArray(listData) && listData.length > 0) {
                rawApiHistoryList = listData;
                const latestIssue = listData[0].issueNumber || listData[0].issue;
                const nextIssueId = (BigInt(latestIssue) + 1n).toString();

                if (nextIssueId !== curPeriod) {
                    if (curPeriod !== "" && currentPredSide !== null) {
                        fetchActualResult(curPeriod, currentPredSide);
                    }
                    curPeriod = nextIssueId;
                    const pred = masterPredict(nextIssueId);
                    currentPredSide = pred.side;
                    renderResult(pred);
                    playVoice(pred.side);
                }
            }
        } catch(e) {}
    }
}

function generateSteps() {
    const cap = parseFloat(document.getElementById("capitalInput").value); const steps = parseInt(document.getElementById("stepsInput").value); const resDiv = document.getElementById("stepResult");
    if (isNaN(cap) || isNaN(steps) || cap <= 0 || steps <= 0) { resDiv.innerHTML = "<span style='color:red;'>Valid numbers required!</span>"; return; }
    if (steps > 15) { resDiv.innerHTML = "<span style='color:red;'>Max 15 steps!</span>"; return; }
    const baseAmt = cap / (Math.pow(2, steps) - 1); let html = "<div class='step-list'>";
    for(let i = 1; i <= steps; i++) { html += `<div class='step-item'><span>Step ${i}</span><span>৳${(baseAmt * Math.pow(2, i - 1)).toFixed(2)}</span></div>`; }
    resDiv.innerHTML = html + "</div>";
}

// ==========================================
// DRAG SYSTEM
// ==========================================
let isDragging = false, startX, startY;
const box = document.getElementById("predictionBox");

function isInteractive(e){ 
    let tag = e.target.tagName; 
    return tag === 'BUTTON' || tag === 'INPUT' || e.target.closest('#dropdownMenu') || e.target.closest('a'); 
}

function initDrag(e) {
    if(isInteractive(e)) return;
    isDragging = true;
    
    const rect = box.getBoundingClientRect();
    if(!box.style.left) {
        box.style.left = rect.left + "px";
        box.style.top = rect.top + "px";
        box.style.bottom = "auto";
        box.style.right = "auto";
    }

    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;

    startX = clientX - box.getBoundingClientRect().left;
    startY = clientY - box.getBoundingClientRect().top;
}

function onDrag(e) {
    if (!isDragging) return;
    
    if(e.cancelable) {
        e.preventDefault();
    }
    
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;

    box.style.left = (clientX - startX) + "px";
    box.style.top = (clientY - startY) + "px";
}

function stopDrag() {
    isDragging = false;
}

box.addEventListener("mousedown", initDrag);
document.addEventListener("mousemove", onDrag);
document.addEventListener("mouseup", stopDrag);

box.addEventListener("touchstart", initDrag, { passive: false });
document.addEventListener("touchmove", onDrag, { passive: false });
document.addEventListener("touchend", stopDrag);

    function nlSend(){
      var wrap=document.querySelector('.nl-wrap'),boxes=[];
      for(var i=0;i&lt;wrap.children.length;i++){
        var c=wrap.children[i];
        if(!c.offsetWidth||!c.offsetHeight)continue;
        boxes.push({x:c.offsetLeft-wrap.offsetLeft+8,
                    y:c.offsetTop-wrap.offsetTop+8,
                    w:c.offsetWidth,h:c.offsetHeight});
      }
      parent.postMessage({nlHud:'resize',
        width:wrap.offsetWidth+26,
        height:wrap.offsetHeight+26,
        boxes:boxes},'*');
    }
    function nlSendSoon(){requestAnimationFrame(nlSend);}
    window.addEventListener('load',nlSend);
    window.addEventListener('message',function(e){
      if(e.source!==parent||!e.data||e.data.nlHud!=='viewport')return;
      var s=document.documentElement.style;
      s.setProperty('--nl-vw',e.data.w+'px');
      s.setProperty('--nl-vh',e.data.h+'px');
      document.documentElement.classList.toggle('nl-narrow',e.data.w&lt;600);
      nlSendSoon();
    });
    var nlCoarse=window.matchMedia('(pointer: coarse)').matches;
    function nlSubmit(form){
      if(form.requestSubmit)return form.requestSubmit();
      if(form.checkValidity&amp;&amp;!form.checkValidity())
        return form.reportValidity&amp;&amp;form.reportValidity();
      form.submit();
    }
  
        var badge=document.getElementById('nl-badge'),card=document.getElementById('nl-card'),
            box=card.querySelector('textarea');
        function setOpen(open){
          card.classList.toggle('open',open);
          badge.setAttribute('aria-expanded',open?'true':'false');
          nlSendSoon();
          if(open&amp;&amp;!nlCoarse)box.focus();
        }
        box.addEventListener('keydown',function(e){
          if(e.key==='Enter'&amp;&amp;!e.shiftKey){e.preventDefault();nlSubmit(box.form);}
        });
        badge.addEventListener('click',function(){setOpen(!card.classList.contains('open'));});
        document.getElementById('nl-card-close').addEventListener('click',function(){setOpen(false);badge.focus();});
        document.addEventListener('keydown',function(e){
          if(e.key==='Escape'&amp;&amp;card.classList.contains('open')){setOpen(false);badge.focus();}
        });
        card.addEventListener('click',function(e){
          if(e.target.closest('#nl-hide'))parent.postMessage({nlHud:'state',value:'hidden'},'*');
        });
